name: Build & push Docker images

# Собирает образы backend и frontend на быстрых раннерах GitHub и публикует их в
# GitHub Container Registry (GHCR). На VPS образы затем просто скачиваются
# (docker compose pull) — без компиляции на слабом сервере.

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: lawyer-api
            context: ./backend
          - name: lawyer-web
            context: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Owner в нижнем регистре
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
