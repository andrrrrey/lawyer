# ============================================================================
#  Lawyer — базовая конфигурация Docker Compose.
#  Сервисы: db (PostgreSQL 16), api (FastAPI), worker (APScheduler), web (nginx).
#  Запуск:  docker compose up --build
#  Веб-интерфейс: http://localhost  (TLS/домен подключаются на Этапе E)
# ============================================================================

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      RUN_MODE: api
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      RUN_MODE: worker
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"

volumes:
  postgres-data:
