[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "lawyer-backend"
version = "0.1.0"
description = "Lawyer — AI-система контроля лидов и маркетинговой аналитики (backend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "gunicorn==23.0.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "pyjwt==2.10.1",
    "apscheduler==3.11.0",
    "httpx==0.28.1",
    "tenacity==9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "aiosqlite==0.20.0",
    "ruff==0.8.4",
    "mypy==1.14.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 — штатный паттерн FastAPI (Depends/Cookie в значениях по умолчанию).
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Сид-модули — таблицы данных с длинными строковыми литералами из прототипа.
"app/seeds/*" = ["E501"]
# Тесты — длинные литералы фикстур (образцы ответов API).
"tests/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
