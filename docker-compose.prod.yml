# ============================================================================
#  Lawyer — производственная конфигурация (VPS, домен, HTTPS/Let's Encrypt).
#  Запуск (после выпуска сертификата — см. docs/DEPLOYMENT.md):
#      docker compose -f docker-compose.prod.yml up -d --build
#  Первичный выпуск сертификата:  ./scripts/init-letsencrypt.sh
# ============================================================================

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      RUN_MODE: api
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      RUN_MODE: worker
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./nginx/prod.conf.template:/etc/nginx/templates/default.conf.template:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot
    ports:
      - "80:80"
      - "443:443"
    # Рендерим прод-шаблон вручную (envsubst подставляет только ${DOMAIN}),
    # затем периодически перезагружаем nginx для подхвата обновлённых сертификатов.
    command: >
      /bin/sh -c "envsubst '$${DOMAIN}' < /etc/nginx/templates/default.conf.template
      > /etc/nginx/conf.d/default.conf;
      while :; do sleep 6h & wait $${!}; nginx -s reload; done &
      nginx -g 'daemon off;'"

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # Автопродление сертификата раз в 12 часов.
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do
      certbot renew --webroot -w /var/www/certbot;
      sleep 12h & wait $${!}; done"

volumes:
  postgres-data:
  certbot-etc:
  certbot-www:
